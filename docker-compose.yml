# ==============================================================================
# İşEmriAl — Docker Compose Konfigürasyonu
# Servisler: db (PostgreSQL), api (NestJS), web (Next.js), migration (One-off)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. VERİTABANI SERVİSİ
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: isemrial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-isemrial_dev}
    ports:
      # Yalnızca loopback arayüzüne bağlanır (Dış ağa açık değildir)
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - isemrial_pgdata:/var/lib/postgresql/data
    networks:
      isemrial_net:
        aliases:
          - db
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-isemrial_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. TEK SEFERLİK MİGRATİON SERVİSİ (One-off Runner)
  # Otomatik çalışmaz; yalnızca 'docker compose run --rm migration' ile tetiklenir.
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isemrial_migration
    profiles:
      - migration
      - tools
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-isemrial_dev}?schema=public}
      NODE_ENV: production
    networks:
      - isemrial_net
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. BACKEND REST API SERVİSİ (NestJS)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isemrial_api
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-isemrial_dev}?schema=public}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-very-secure-random-secret-in-production-min-32-chars}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-7}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    networks:
      - isemrial_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. FRONTEND WEB SERVİSİ (Next.js Standalone)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isemrial_web
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_ENABLE_DEMO_LOGIN: ${NEXT_PUBLIC_ENABLE_DEMO_LOGIN:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - isemrial_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ------------------------------------------------------------------------------
# AĞLAR VE KALICI BİRİMLER (Networks & Volumes)
# ------------------------------------------------------------------------------
networks:
  isemrial_net:
    name: isemrial_net
    driver: bridge

volumes:
  isemrial_pgdata:
    name: isemrial_pgdata
